<title>Probabilities and Odds Demo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap">
<style>
:root{
  --bg:#ffffff; --fg:#1d1d1f; --muted:#5f5f66; --light:#a3a3aa; --tile:#f4f4f6; --soft:#FBEAEC; --goodbg:#E6F4EC;
  --red:#CF2C3F; --green:#2E9E5B; --grid:#ececef; --line:#1d1d1f; --track:#d9d9de; --inputbg:#ffffff; --inputbd:#cfcfd4; --rule:#e2e2e6;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#141416; --fg:#f2f2f4; --muted:#a9a9b2; --light:#6a6a72; --tile:#222226; --soft:#3a1f24; --goodbg:#1c3327;
  --red:#E8536A; --green:#4CBF78; --grid:#2c2c31; --line:#f2f2f4; --track:#3a3a40; --inputbg:#1c1c20; --inputbd:#44444b; --rule:#3a3a40; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#141416; --fg:#f2f2f4; --muted:#a9a9b2; --light:#6a6a72; --tile:#222226; --soft:#3a1f24; --goodbg:#1c3327;
  --red:#E8536A; --green:#4CBF78; --grid:#2c2c31; --line:#f2f2f4; --track:#3a3a40; --inputbg:#1c1c20; --inputbd:#44444b; --rule:#3a3a40; color-scheme:dark }
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:Inter,Helvetica,Arial,sans-serif;font-size:14px;line-height:1.4}
.wrap{max-width:1180px;margin:0 auto;padding-block:16px 24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1{font-size:28px;font-weight:700;color:var(--red);margin:0 0 14px;text-wrap:balance}
h3{font-size:16px;font-weight:700;margin:0 0 8px}
.lab{font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);font-weight:700;margin:0 0 6px}
.layout{display:grid;grid-template-columns:270px minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:800px){.layout{grid-template-columns:1fr}}
.well{background:var(--tile);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:14px}
.ctl label{display:block;font-weight:600;margin-bottom:4px}
.ctl .val{float:right;color:var(--red);font-weight:700}
input[type=range]{width:100%;margin:6px 0 2px;accent-color:var(--red);height:22px}
button{font:inherit;font-weight:700;padding:9px 12px;border:0;border-radius:10px;background:var(--red);color:#fff;cursor:pointer}
button:hover{filter:brightness(1.08)}
.main{display:flex;flex-direction:column;gap:18px;min-width:0}
.side{display:flex;flex-direction:column;gap:18px;min-width:0}
.plots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.row{display:grid;grid-template-columns:minmax(0,720px);gap:18px;align-items:start}
@media (max-width:800px){.plots{grid-template-columns:1fr}.row{grid-template-columns:1fr}table.t{font-size:13px}table.t th,table.t td{padding:5px 4px}table.t th{white-space:normal}}
svg{display:block;width:100%;height:auto;max-width:100%}
table.t{width:100%;border-collapse:collapse;font-size:15px}
table.t th{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);font-weight:700;padding:6px 8px;border-bottom:2px solid var(--line);text-align:right;white-space:nowrap}
table.t th:first-child,table.t td:first-child{text-align:left}
table.t td{padding:7px 8px;text-align:right;border-bottom:1px solid var(--rule);font-variant-numeric:tabular-nums}
table.t td.or{color:var(--red);font-weight:700}
table.t td.dp{font-weight:700}
.note{color:var(--muted);font-size:13px;margin:8px 0 0}
.axis text{fill:var(--muted);font-size:12px}
.axis .title{fill:var(--fg);font-weight:700;font-size:13px}
.gridline{stroke:var(--grid)}
</style>

<div class="wrap">
  <h1>Probabilities and Odds Demo</h1>
  <div class="layout">
    <div class="side">
      <div class="well">
        <div class="lab">Simulate</div>
        <div class="ctl"><label>Students <span class="val" id="nv">60</span></label><input type="range" id="n" min="0" max="9" step="1" value="3"></div>
        <div class="ctl"><label>Intercept: grade at 0 hours <span class="val" id="b0v">2</span></label><input type="range" id="b0" min="1" max="6" step="0.5" value="2"></div>
        <div class="ctl"><label>Slope: grade points per hour <span class="val" id="b1v">0.4</span></label><input type="range" id="b1" min="0" max="1" step="0.05" value="0.4"></div>
        <button type="button" id="newclass">New class</button>
      </div>
    </div>
    <div class="main">
      <div class="plots">
        <div><h3>Probability of passing</h3><div id="p2"></div></div>
        <div><h3>Odds of passing</h3><div id="p3"></div></div>
        <div><h3>Log-odds of passing</h3><div id="p4"></div></div>
      </div>
      <div class="row">
        <div style="min-width:0"><h3>One more hour</h3><div id="tbl" style="overflow-x:auto"></div><p class="note" id="note"></p></div>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
const PASS=4, NOISE=0.5, SEED=116, NS_=[10,20,30,60,100,200,500,1000,2000,5000], HRS=[4,5,6,7,8];
let seed=SEED;
// The class from the lecture slides (same 60 students, grade = (score - 20) / 10)
const CLASS0={hours:[1.724,8.769,9.572,9.509,5.077,5.983,3.002,5.471,3.130,5.018,3.169,1.783,9.525,9.401,0.230,2.765,9.478,6.384,6.093,1.273,7.691,6.625,1.987,8.274,0.959,0.061,3.351,8.683,4.690,3.195,9.979,6.926,7.716,5.085,9.190,7.400,6.957,4.628,2.665,2.501,6.570,5.133,1.970,4.438,0.112,9.232,4.270,2.507,7.480,5.787,2.593,8.541,3.534,2.475,0.243,4.427,6.164,2.449,0.361,5.981],grade:[2.002,6.000,5.491,3.328,4.171,5.214,1.926,3.628,4.538,4.423,3.109,1.178,6.000,5.935,1.040,4.081,6.000,6.000,5.043,2.727,6.000,5.668,1.000,4.935,3.593,2.574,3.717,6.000,3.702,4.943,5.636,4.726,5.639,2.102,5.605,4.916,3.639,3.090,3.280,3.828,5.064,3.879,2.351,5.322,1.280,5.303,1.000,3.287,5.515,4.392,2.442,5.530,3.507,3.938,2.214,3.933,4.415,3.374,1.002,5.721]};
const $=id=>document.getElementById(id);

// Seeded RNG (mulberry32) so the class is the same for everyone
function rng(seed){let a=seed>>>0;return function(){a=(a+0x6D2B79F5)>>>0;let t=a;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296;};}
function rlogis(r,scale){let u=r();u=Math.min(Math.max(u,1e-9),1-1e-9);return scale*Math.log(u/(1-u));}
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const plogis=x=>1/(1+Math.exp(-x));

function simulate(n,b0,b1){
  if(seed===SEED&&n===60&&b0===2&&b1===0.4) return {hours:CLASS0.hours.slice(),grade:CLASS0.grade.slice(),pass:CLASS0.grade.map(g=>g>=PASS?1:0)};
  const r=rng(seed), hours=[], grade=[], pass=[];
  for(let i=0;i<n;i++) hours.push(r()*10);
  for(let i=0;i<n;i++){const g=clamp(b0+b1*hours[i]+rlogis(r,NOISE),1,6);grade.push(g);pass.push(g>=PASS?1:0);}
  return {hours,grade,pass};
}

// Logistic regression by IRLS (same estimates as glm(..., binomial))
function fitLogit(x,y){
  let a=0,b=0;
  for(let it=0;it<50;it++){
    let s00=0,s01=0,s11=0,g0=0,g1=0;
    for(let i=0;i<x.length;i++){const p=plogis(a+b*x[i]);const w=p*(1-p);const r=y[i]-p;s00+=w;s01+=w*x[i];s11+=w*x[i]*x[i];g0+=r;g1+=r*x[i];}
    const det=s00*s11-s01*s01; if(!(Math.abs(det)>1e-12)) break;
    const da=( s11*g0-s01*g1)/det, db=(-s01*g0+s00*g1)/det;
    a+=da;b+=db;
    if(Math.abs(da)+Math.abs(db)<1e-8) break;
    if(!isFinite(a)||!isFinite(b)||Math.abs(b)>50){break;}
  }
  let s00=0,s01=0,s11=0;
  for(let i=0;i<x.length;i++){const p=plogis(a+b*x[i]);const w=p*(1-p);s00+=w;s01+=w*x[i];s11+=w*x[i]*x[i];}
  const det=s00*s11-s01*s01; const se=det>1e-12?Math.sqrt(s00/det):NaN;
  const z=b/se; const p=isFinite(z)?2*(1-Phi(Math.abs(z))):NaN;
  const sep=!isFinite(se)||Math.abs(b)>20||se>50;   // perfect separation: the slope runs away
  return [a,b,se,p,sep];
}
function Phi(z){const t=1/(1+0.2316419*z);const d=0.3989423*Math.exp(-z*z/2);return 1-d*t*(0.3193815+t*(-0.3565638+t*(1.781478+t*(-1.821256+t*1.330274))));}
function f2(v){return (Math.round(v*100)/100).toFixed(2);}
function fodds(v){return v<0.1?v.toFixed(3):v<100?v.toFixed(2):v<1000?v.toFixed(1):Math.round(v).toLocaleString('en-US');}

// ---- SVG helpers ----
const NS='http://www.w3.org/2000/svg';
function el(tag,attrs,text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!=null)e.textContent=text;return e;}
function frame(W,H,m,xl,yl,xt,yt,xdom,ydom,fmt){
  const svg=el('svg',{viewBox:`0 0 ${W} ${H}`,role:'img','aria-label':yl+' on '+xl});
  const X=v=>m.l+(v-xdom[0])/(xdom[1]-xdom[0])*(W-m.l-m.r);
  const Y=v=>H-m.b-(v-ydom[0])/(ydom[1]-ydom[0])*(H-m.t-m.b);
  const ax=el('g',{class:'axis'});
  for(const t of xt){ax.appendChild(el('line',{x1:X(t),x2:X(t),y1:m.t,y2:H-m.b,class:'gridline'}));ax.appendChild(el('text',{x:X(t),y:H-m.b+16,'text-anchor':'middle'},t));}
  for(const t of yt){ax.appendChild(el('line',{x1:m.l,x2:W-m.r,y1:Y(t),y2:Y(t),class:'gridline'}));ax.appendChild(el('text',{x:m.l-6,y:Y(t)+4,'text-anchor':'end'},fmt?fmt(t):t));}
  ax.appendChild(el('text',{x:(m.l+W-m.r)/2,y:H-6,'text-anchor':'middle',class:'title'},xl));
  ax.appendChild(el('text',{x:14,y:(m.t+H-m.b)/2,'text-anchor':'middle',class:'title',transform:`rotate(-90 14 ${(m.t+H-m.b)/2})`},yl));
  svg.appendChild(ax);
  return {svg,X,Y};
}
const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
function showIdx(n){if(n<=300)return [...Array(n).keys()];const r=rng(7),idx=[...Array(n).keys()];for(let i=n-1;i>0;i--){const j=Math.floor(r()*(i+1));[idx[i],idx[j]]=[idx[j],idx[i]];}return idx.slice(0,300);}
function niceTicks(lo,hi,n){const span=hi-lo;const raw=span/n;const mag=Math.pow(10,Math.floor(Math.log10(raw)));const r=raw/mag;const step=(r<1.5?1:r<3.5?2:r<7.5?5:10)*mag;const t=[];for(let v=Math.ceil(lo/step)*step;v<=hi+1e-9;v+=step)t.push(+v.toFixed(6));return t;}

const W=340,H=250,M={l:48,r:12,t:12,b:40};
function curvePath(X,Y,f){let s='';for(let i=0;i<=200;i++){const h=i/20;const y=f(h);if(!isFinite(y))continue;s+=(s?'L':'M')+X(h).toFixed(1)+' '+Y(y).toFixed(1)+' ';}return s;}
function drawProb(d,fit,ok){
  const {svg,X,Y}=frame(W,H,M,'Hours studied','Probability of passing',[0,2,4,6,8,10],[0,0.5,1],[0,10],[0,1],t=>t===0||t===1?t:'0.5');
  const [a,b]=fit; const RED=css('--red'),INK=css('--line'),LIGHT=css('--light');
  for(const i of showIdx(d.hours.length)) svg.appendChild(el('circle',{cx:X(d.hours[i]),cy:Y(d.pass[i]),r:3.5,fill:d.pass[i]?INK:LIGHT,opacity:0.6}));
  if(!ok) return svg;
  const P=h=>plogis(a+b*h);
  svg.appendChild(el('path',{d:curvePath(X,Y,P),fill:'none',stroke:RED,'stroke-width':3.5,'stroke-linejoin':'round'}));
  let st='';for(let i=0;i<HRS.length-1;i++){const h=HRS[i],h2=HRS[i+1];st+=`M${X(h).toFixed(1)} ${Y(P(h)).toFixed(1)} L${X(h2).toFixed(1)} ${Y(P(h)).toFixed(1)} L${X(h2).toFixed(1)} ${Y(P(h2)).toFixed(1)} `;}
  svg.appendChild(el('path',{d:st,fill:'none',stroke:INK,'stroke-width':2}));
  for(const h of HRS) svg.appendChild(el('circle',{cx:X(h),cy:Y(P(h)),r:5,fill:INK}));
  return svg;
}
function drawOdds(d,fit,ok){
  const [a,b]=fit; const RED=css('--red'),INK=css('--line');
  const O=h=>Math.exp(a+b*h);
  let top=ok?Math.max(O(10),O(0),1.5):1.5; top=Math.min(top,1e6); const yt=niceTicks(0,top,4); top=yt[yt.length-1]>=top?yt[yt.length-1]:top;
  const {svg,X,Y}=frame(W,H,M,'Hours studied','Odds of passing',[0,2,4,6,8,10],yt,[0,10],[0,top],t=>t>=1e6?(t/1e6)+'M':t>=1000?(t/1000)+'k':t);
  if(!ok) return svg;
  svg.appendChild(el('path',{d:curvePath(X,Y,h=>Math.min(O(h),top)),fill:'none',stroke:RED,'stroke-width':3.5,'stroke-linejoin':'round'}));
  for(const h of HRS) if(O(h)<=top) svg.appendChild(el('circle',{cx:X(h),cy:Y(O(h)),r:5,fill:INK}));
  return svg;
}
function drawLogOdds(d,fit,ok){
  const [a,b]=fit; const RED=css('--red'),INK=css('--line');
  const L=h=>a+b*h;
  let lo=ok?Math.min(L(0),L(10),-4):-4, hi=ok?Math.max(L(0),L(10),4):4; lo=Math.floor(lo); hi=Math.ceil(hi);
  const yt=niceTicks(lo,hi,4);
  const {svg,X,Y}=frame(W,H,M,'Hours studied','Log-odds of passing',[0,2,4,6,8,10],yt,[0,10],[lo,hi]);
  if(!ok) return svg;
  svg.appendChild(el('line',{x1:X(0),y1:Y(L(0)),x2:X(10),y2:Y(L(10)),stroke:RED,'stroke-width':3.5}));
  for(const h of HRS) svg.appendChild(el('circle',{cx:X(h),cy:Y(L(h)),r:5,fill:INK}));
  return svg;
}

function render(){
  const n=NS_[+$('n').value],b0=+$('b0').value,b1=+$('b1').value;
  $('nv').textContent=n.toLocaleString('en-US');$('b0v').textContent=b0;$('b1v').textContent=b1;
  const d=simulate(n,b0,b1);
  const fit=fitLogit(d.hours,d.pass);
  const [a,b,se,p,sep]=fit; const fit2=[+f2(a),+f2(b)];
  const npass=d.pass.reduce((x,y)=>x+y,0);
  const ok=!(npass===0||npass===n||sep);
  $('p2').replaceChildren(drawProb(d,fit2,ok));
  $('p3').replaceChildren(drawOdds(d,fit2,ok));
  $('p4').replaceChildren(drawLogOdds(d,fit2,ok));

  // use the coefficients as displayed (two decimals), so the table matches the equation on screen
  const a2=+f2(a), b2=+f2(b);
  const P=h=>plogis(a+b*h), O=h=>Math.exp(a+b*h), OR=Math.exp(b);
  let rows='';
  for(let i=0;i<HRS.length;i++){const h=HRS[i];
    const pr=ok?Math.round(100*P(h))+'%':'–', dp=ok&&i?'+'+Math.round(100*(P(h)-P(HRS[i-1])))+' points':'–', od=ok?fodds(O(h)):'–', r=ok&&i?'×'+f2(OR):'–';
    rows+=`<tr><td>${h}</td><td>${pr}</td><td class="dp">${dp}</td><td>${od}</td><td class="or">${r}</td></tr>`;}
  $('note').textContent=npass===0?'Nobody passed: there is nothing to model.':npass===n?'Everybody passed: there is nothing to model.':sep?'Pass and fail are (almost) perfectly separated by hours, so the slope cannot be estimated.':'';
  $('tbl').innerHTML=`<table class="t"><tr><th>Hours</th><th>Probability</th><th>Change</th><th>Odds</th><th>Ratio to hour before</th></tr>${rows}</table>`;

}
$('newclass').addEventListener('click',()=>{seed=(seed+1)%4294967296;render();});
for(const id of ['n','b0','b1']) $(id).addEventListener('input',render);
let rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(render,120);});
if(window.matchMedia){window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',render);}
new MutationObserver(render).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
render();
})();
</script>
